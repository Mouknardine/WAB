name: Deploy to Infomaniak

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Génère les identifiants SMTP du formulaire de contact à partir
      # des secrets GitHub (encodés en base64 : sûrs quels que soient
      # les caractères du mot de passe). Le fichier est téléversé avec
      # le site mais n'existe jamais dans le dépôt.
      - name: Générer la configuration email
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASSWORD }}
        run: |
          {
            echo '<?php'
            echo "const SMTP_USER_B64 = '$(printf %s "$SMTP_USER" | base64 -w0)';"
            echo "const SMTP_PASS_B64 = '$(printf %s "$SMTP_PASS" | base64 -w0)';"
          } > mail-config.php

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./
          server-dir: /sites/wearebrothers.ch/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            indexnow.sh

      # Signale les pages à Bing / Yandex dès qu'elles sont en ligne.
      # La clé de vérification part avec le site à l'étape précédente.
      # N'échoue jamais le déploiement : un ping raté n'est pas bloquant.
      - name: Notifier IndexNow
        continue-on-error: true
        run: |
          KEY=0515e9f961a495712d522e48173e1a6f
          curl -sS -X POST "https://api.indexnow.org/indexnow" \
               -H "Content-Type: application/json; charset=utf-8" \
               -w '\nIndexNow a répondu : %{http_code} (200/202 = accepté)\n' \
               -d "{
                     \"host\": \"wearebrothers.ch\",
                     \"key\": \"$KEY\",
                     \"keyLocation\": \"https://wearebrothers.ch/$KEY.txt\",
                     \"urlList\": [
                       \"https://wearebrothers.ch/\",
                       \"https://wearebrothers.ch/realisations\",
                       \"https://wearebrothers.ch/studio\",
                       \"https://wearebrothers.ch/contact\"
                     ]
                   }"
